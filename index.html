<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一站 · 双人求职手账</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#">↗ <span>下一站<small>OUR NEXT CHAPTER</small></span></a><p class="eyebrow">求职工作台</p><button class="nav active" id="all">▦ &nbsp; 机会总览</button><p class="eyebrow">我们的空间</p><button class="nav" data-person="马润哲"><i class="avatar">马</i>马润哲<span>→</span></button><button class="nav" data-person="李嘉艺"><i class="avatar pink">李</i>李嘉艺<span>→</span></button><div class="aside-bottom"><strong>每一步，都离下一站更近。</strong><p>把机会记下来，把进展留住。</p><small>本机自动保存<br>公开共享 · 自动同步 GitHub</small></div></aside><main><header><span>我们的求职手账 <b>/</b> <span id="crumb">机会总览</span></span><div><button id="import">导入备份</button><button id="export">↓ 导出备份</button></div></header><section class="intro"><div><p class="eyebrow">A LITTLE PROGRESS, EVERY DAY</p><h1 id="title">下一站，值得期待。</h1><p>从心动的机会，到收到的好消息。在这里，记录每一步。</p></div><button class="primary" id="add">＋ 添加公司</button></section><section class="stats" id="stats"></section><section class="workspace"><div class="section-head"><div><h2>我的机会清单 <span id="count"></span></h2><p>先收藏适合的，再一步步推进。</p></div><div class="view"><button id="board" class="selected">▦ 看板</button><button id="list">☷ 列表</button></div></div><div class="filters"><input id="search" placeholder="搜索公司、岗位、城市或备注…" aria-label="搜索机会"><select id="statusFilter" aria-label="筛选阶段"><option value="">全部阶段</option><option>符合条件 · 待投递</option><option>已投递</option><option>笔试 / 测评</option><option>面试中</option><option>已获 Offer</option><option>已结束</option></select><select id="sort" aria-label="排序"><option value="updated">最近更新</option><option value="deadline">截止日期优先</option></select></div><div id="content"></div></section><footer><span>小小记录，慢慢靠近理想的工作。</span><span id="saveState">本地保存 · 支持备份</span></footer></main><dialog id="editor"><form id="form"><div class="modal-head"><div><p class="eyebrow">ONE MORE POSSIBILITY</p><h2 id="formTitle">添加一个新机会</h2></div><button type="button" id="close" aria-label="关闭">✕</button></div><input type="hidden" name="id"><div class="fields"><label>所属人<select name="person"><option>马润哲</option><option>李嘉艺</option></select></label><label>当前阶段<select name="status"><option>符合条件 · 待投递</option><option>已投递</option><option>笔试 / 测评</option><option>面试中</option><option>已获 Offer</option><option>已结束</option></select></label><label>公司名称 *<input name="company" required maxlength="100" placeholder="例如：你心仪的公司"></label><label>岗位名称 *<input name="role" required maxlength="100" placeholder="例如：产品运营实习生"></label><label>工作城市<input name="city" maxlength="80" placeholder="城市 / 远程"></label><label>优先级<select name="priority"><option>优先考虑</option><option selected>正常关注</option><option>备选机会</option></select></label><label>薪资 / 待遇<input name="salary" maxlength="100" placeholder="例如：15–20K / 面议"></label><label>投递渠道<input name="channel" maxlength="100" placeholder="官网 / 内推 / 招聘平台"></label><label>投递日期<input type="date" name="applied"></label><label>投递截止日期<input type="date" name="deadline"></label><label>下次跟进日期<input type="date" name="followup"></label><label>招聘链接<input type="url" name="url" placeholder="https://…"></label><label class="wide">下一步<input name="next" maxlength="200" placeholder="例如：修改简历、完成测评、准备一面"></label><label class="wide">匹配理由 / 备注<textarea name="notes" rows="3" maxlength="3000" placeholder="为什么适合？岗位要求、联系人、面试反馈，都可以记在这里。"></textarea></label></div><div class="modal-actions"><button type="button" id="delete" class="danger">删除记录</button><button type="submit" class="primary">保存机会</button></div></form></dialog><input type="file" accept="application/json,.json" id="file" hidden><div id="toast" role="status"></div><script src="app.js"></script><script src="notes.js"></script><script src="resumes.js"></script><script src="sync.js"></script></body></html>
